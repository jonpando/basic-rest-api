name: CI-CD

on:

  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    uses: jonpando/dotnet-template-workflows/.github/workflows/build-template.yml@main

  docker:

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Analyze Project
        id: metrics
        uses: ./.github/actions/build-metrics

      - name: Show Metrics
        run: |
          echo "Projects = ${{ steps.metrics.outputs.projects }}"
          echo "Files = ${{ steps.metrics.outputs.files }}"
          echo "Lines = ${{ steps.metrics.outputs.lines }}"
          echo "Branch = ${{ steps.metrics.outputs.branch }}"
          echo "Commit = ${{ steps.metrics.outputs.sha }}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/basic-rest-api:latest .

      - name: Push Docker Image
        run: |
          docker push \
          ghcr.io/${{ github.repository_owner }}/basic-rest-api:latest

  deploy:

    needs: docker

    uses: jonpando/dotnet-template-workflows/.github/workflows/deploy-template.yml@main