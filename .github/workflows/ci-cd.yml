name: CI-CD

on:

  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    uses: TU_USUARIO_GITHUB/dotnet-template-workflows/.github/workflows/build-template.yml@main

  docker:

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Metadata
        id: metadata
        uses: ./.github/actions/version-generator

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/orders-api:${{ steps.metadata.outputs.docker-tag }} .

      - name: Push Docker Image
        run: |
          docker push \
          ghcr.io/${{ github.repository_owner }}/orders-api:${{ steps.metadata.outputs.docker-tag }}

  deploy:

    needs: docker

    uses: jopnpando/dotnet-template-workflows/.github/workflows/deploy-template.yml@main
